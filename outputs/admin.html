  <section class="login-gate"><form class="login-card" id="loginForm"><h1>资料管理</h1><p>请输入后台密码后进入管理中心</p><input id="loginToken" type="password" autocomplete="current-password" placeholder="后台密码" required><button type="submit">安全登录</button><div class="login-error" id="loginError"></div></form></section>

    <div class="admin-context" id="adminContext"><b>数据概览</b><small>查看资料状态、访问量和广告点击情况</small></div>
    <section class="stats"><div class="stat"><b id="totalCount">0</b><small>全部资料</small></div><div class="stat"><b id="pendingCount">0</b><small>待开奖</small></div><div class="stat"><b id="hitCount">0</b><small>已命中</small></div><div class="stat"><b id="missCount">0</b><small>未命中</small></div></section>
    <div class="toolbar"><select id="lotteryFilter"><option value="澳门">澳门</option><option value="香港">香港</option><option value="疯狂天天彩">疯狂天天彩</option><option value="">全部彩种</option></select><select id="sectionFilter"><option value="">全部板块</option></select><select id="authorFilter"><option value="">全部作者</option></select><input id="search" placeholder="搜索期号、作者或内容"><button id="runAnalysis" type="button">自动分析</button><button id="syncDraw" type="button">同步开奖</button><button id="autoAll" type="button">批量判定</button><button id="nextIssue" type="button">生成下一期</button><button id="newRecord" type="button">＋ 新增</button></div>

    document.querySelector('#nextIssue').onclick=()=>{const selectedLottery=document.querySelector('#lotteryFilter').value||'澳门';if(!confirm(`为${selectedLottery}的普通板块及每位高手复制一条下一期记录吗？复制后请修改预测内容再发布。`))return;const created=[];Object.keys(labels).filter(section=>section!=='expert').forEach(section=>{const latest=records.filter(x=>(x.lottery||'澳门')===selectedLottery&&x.section===section&&/^\d+$/.test(x.issue)).sort((a,b)=>Number(b.issue)-Number(a.issue))[0];if(!latest)return;const issue=String(Number(latest.issue)+1);if(records.some(x=>(x.lottery||'澳门')===selectedLottery&&x.section===section&&x.issue===issue))return;created.push({...latest,id:`${selectedLottery}-${section}-${issue}-${Date.now()}`,lottery:selectedLottery,issue,result:'',status:'pending'})});const groups=new Map();records.filter(x=>(x.lottery||'澳门')===selectedLottery&&x.section==='expert'&&x.author&&x.category).forEach(item=>{const issue=Number(String(item.issue).match(/\d+/)?.[0]);if(!issue)return;const key=`${item.author}|${item.category}`,current=groups.get(key);if(!current||issue>current.issue)groups.set(key,{item,issue})});groups.forEach(({item,issue})=>{const next=String(issue+1);if(!records.some(x=>(x.lottery||'澳门')===selectedLottery&&x.section==='expert'&&x.author===item.author&&x.category===item.category&&String(x.issue).replace(/期$/,'')===next))created.push({...item,id:`expert-${selectedLottery}-${Date.now()}-${created.length}`,lottery:selectedLottery,issue:next,content:item.content,result:'',status:'pending'})});records=[...created,...records];persist();updateAuthorOptions();recordPage=1;render();toast(`已生成${selectedLottery} ${created.length}条下一期资料，请编辑后发布`)};
    document.querySelector('#syncDraw').onclick=async()=>{const button=document.querySelector('#syncDraw'),state=document.querySelector('#drawSyncAdmin'),selectedLottery=document.querySelector('#lotteryFilter').value||'澳门';button.disabled=true;state.textContent=`正在同步并判断${selectedLottery}最新开奖…`;try{const response=await fetch(`auto-update.php?lottery=${encodeURIComponent(selectedLottery)}`,{method:'POST',headers:{'X-Admin-Token':adminToken}}),data=await response.json();if(!response.ok||!data.ok)throw new Error(data.message||'同步失败');const content=await fetch(`content-data.php?t=${Date.now()}`,{cache:'no-store'}).then(x=>x.json());records=(content.records||records).map(item=>({...item,lottery:item.lottery||'澳门'}));persist();updateAuthorOptions();render();state.innerHTML=`<b>${safe(selectedLottery)} 第${safe(data.latestIssue)}期</b> · 普通板块和高手资料均已自动判断 · 下一期 ${safe(data.nextIssue)}`;toast(`${selectedLottery}开奖结果和资料判定已同步`)}catch(error){state.textContent=`${selectedLottery}同步失败：${error.message||'接口暂时不可用'}`;toast(error.message||'同步失败')}finally{button.disabled=false}};
    document.querySelector('#exportData').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,updatedAt:new Date().toISOString(),records},null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`paogou-content-${new Date().toISOString().slice(0,10)}.json`;link.click();URL.revokeObjectURL(link.href);toast('资料备份已导出')};
    document.querySelector('#importData').onclick=()=>document.querySelector('#importFile').click();document.querySelector('#importFile').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.records))throw new Error();records=data.records;persist();render();toast('资料备份已导入')}catch(_){toast('导入失败：文件格式不正确')}e.target.value=''};
    document.querySelector('#publish').onclick=async()=>{try{const data=await publishRecords('');toast(`已发布 ${data.count} 条资料`)}catch(error){toast(error.message||'发布失败')}};
    async function loadTraffic(){const labels={'/':'首页','/history':'历史记录','/live':'开奖直播','/chat':'心水交流','/formula':'六合公式','/expert':'高手资料'};try{const response=await fetch(`stats-data.php?t=${Date.now()}`,{headers:{'X-Admin-Token':adminToken},cache:'no-store'}),data=await response.json();if(!response.ok||!data.ok)throw new Error();const totals={};data.stats.forEach(item=>totals[item.path]=(totals[item.path]||0)+Number(item.views));const pageTotal=Object.keys(labels).reduce((sum,path)=>sum+(totals[path]||0),0),clicks=Object.entries(totals).filter(([path])=>path.startsWith('click:')).sort((a,b)=>b[1]-a[1]),clickTotal=clicks.reduce((sum,[,value])=>sum+value,0);document.querySelector('#trafficTotal').textContent=`总访问 ${pageTotal}`;document.querySelector('#trafficGrid').innerHTML=Object.entries(labels).map(([path,label])=>`<div class="traffic-item"><b>${totals[path]||0}</b><span>${label}</span></div>`).join('');document.querySelector('#interactionTotal').textContent=`总点击 ${clickTotal}`;document.querySelector('#interactionGrid').innerHTML=clicks.length?clicks.map(([path,value])=>{const [,type,name]=path.split(':');return `<div class="traffic-item"><b>${value}</b><span>${type==='ad'?'广告 · ':'互联 · '}${safe(name)}</span></div>`}).join(''):'<div class="traffic-item"><b>0</b><span>暂无点击</span></div>'}catch(_){document.querySelector('#trafficTotal').textContent='读取失败';document.querySelector('#interactionTotal').textContent='读取失败'}}
  </script>
</body>
