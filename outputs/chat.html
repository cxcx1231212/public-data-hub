<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>心水交流－马会资料</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080808;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.chat-page{width:min(100%,760px);min-height:100vh;margin:auto;background:#0d0d0d;display:flex;flex-direction:column}.chat-top{height:58px;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;padding:0 10px;border-bottom:1px solid #342a16;background:#090806;position:sticky;top:0;z-index:3}.chat-top a{color:#e7c55e;text-decoration:none;font-size:15px}.clear-chat{justify-self:end;border:0;background:none;color:#94866a;font:12px inherit;cursor:pointer}.chat-title{text-align:center}.chat-title strong{display:block;color:#f0cf69;font-size:18px}.chat-title span{display:block;margin-top:2px;color:#62d483;font-size:11px}.chat-rule{padding:9px 12px;border-bottom:1px solid #2b2619;background:#151208;color:#cdbb7a;font-size:12px;line-height:1.55}.chat-list{flex:1;min-height:430px;padding:14px 11px 128px;overflow-y:auto}.chat-day{text-align:center;margin:2px 0 15px;color:#777;font-size:11px}.message{display:flex;gap:8px;margin-bottom:14px;align-items:flex-start}.avatar{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#3e3110,#171309);border:1px solid #695422;color:#f3ce61;font-weight:900}.message-body{min-width:0;max-width:78%}.message-meta{display:flex;align-items:center;gap:7px;margin:0 0 5px;color:#aaa;font-size:11px}.message-meta b{color:#dfca88;font-size:12px}.bubble{display:inline-block;padding:9px 11px;border:1px solid #373021;border-radius:3px 12px 12px;background:#191713;color:#eee;font-size:14px;line-height:1.55;word-break:break-word}.message.self{flex-direction:row-reverse}.message.self .message-body{text-align:right}.message.self .message-meta{justify-content:flex-end}.message.self .bubble{border-color:#72591c;background:#2b220c;color:#f4df9c;border-radius:12px 3px 12px 12px}.composer{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);padding:8px 10px max(10px,env(safe-area-inset-bottom));border-top:1px solid #3d321b;background:rgba(13,13,13,.97);backdrop-filter:blur(9px)}.quick-row,.send-row{display:flex;gap:7px}.quick-row{margin-bottom:7px}.quick-row button{height:28px;padding:0 9px;border:1px solid #403921;border-radius:14px;background:#18150d;color:#d9c47e;font-size:12px}.composer input{min-width:0;height:40px;border:1px solid #403921;border-radius:8px;background:#181818;color:#fff;padding:0 11px;font:14px inherit;outline:none}.nickname{width:105px}.message-input{flex:1}.send{height:40px;border:0;border-radius:8px;padding:0 17px;background:linear-gradient(180deg,#e4bd48,#a77b16);color:#151006;font-weight:900;cursor:pointer}.status{flex:1;text-align:right;color:#777;font-size:11px;align-self:center}@media(max-width:430px){.chat-list{min-height:calc(100vh - 104px)}.message-body{max-width:83%}.nickname{width:88px}.send{padding:0 13px}.chat-rule{font-size:11px}.quick-row button{padding:0 7px;font-size:11px}}
  </style>
  <style>
    .chat-draw{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:center;padding:8px 12px;border-bottom:1px solid #29251b;background:#10100e;font-size:11px}.chat-draw b{padding:3px 7px;border-radius:4px;background:#7b1919;color:#ffd8d2}.chat-draw span{color:#b8aa84;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.message.admin .avatar{border-color:#a74735;background:linear-gradient(145deg,#752a1e,#24100d);color:#ffd1c8}.admin-mark{padding:1px 5px;border-radius:3px;background:#862a20;color:#ffd8d2;font-size:9px;font-style:normal}
  </style>
</head>
<body>
  <main class="chat-page">
    <header class="chat-top"><a href="index.html">‹ 返回</a><div class="chat-title"><strong>心水交流</strong><span id="onlineCount">正在连接六合王…</span></div><button class="clear-chat" id="refreshChat" type="button">刷新</button></header>
    <div class="chat-rule">六合王实时交流 · 无需登录 · 仅限中文、数字和空格</div>
    <div class="chat-draw"><b>系统播报</b><span id="chatDraw">正在同步澳门开奖…</span></div>
    <section class="chat-list" id="chatList" aria-live="polite"><div class="chat-day">今天</div></section>
    <form class="composer" id="chatForm">
      <div class="quick-row"><button type="button" data-quick="期待开奖">期待开奖</button><button type="button" data-quick="祝大家好运">祝大家好运</button><button type="button" data-quick="理性交流">理性交流</button><span class="status" id="saveStatus">已自动保存</span></div>
      <div class="send-row"><input class="nickname" id="nickname" maxlength="12" placeholder="你的昵称"><input class="message-input" id="messageInput" maxlength="120" placeholder="输入交流内容"><button class="send" type="submit">发送</button></div>
    </form>
  </main>
  <script>
    const list=document.querySelector('#chatList'),form=document.querySelector('#chatForm'),nickname=document.querySelector('#nickname'),input=document.querySelector('#messageInput'),status=document.querySelector('#saveStatus'),online=document.querySelector('#onlineCount'),api='/api/chat/v1';
    const storage={get:(key,fallback='')=>{try{return localStorage.getItem(key)??fallback}catch(_){return fallback}},set:(key,value)=>{try{localStorage.setItem(key,value)}catch(_){}}};
    const device=storage.get('liuhe-chat-device')||((crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)));storage.set('liuhe-chat-device',device);let suffix=String(Math.floor(1000+Math.random()*9000));
    function add(item){const name=item.nickname||'游客',time=new Date(item.createdAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),row=document.createElement('article');row.className='message'+(item.deviceId===device?' self':'')+(item.isAdmin?' admin':'');const avatar=document.createElement('span'),body=document.createElement('div'),meta=document.createElement('div'),author=document.createElement('b'),clock=document.createElement('span'),bubble=document.createElement('div');avatar.className='avatar';avatar.textContent=[...name][0]||'友';body.className='message-body';meta.className='message-meta';author.textContent=name;clock.textContent=time;meta.append(author);if(item.isAdmin){const mark=document.createElement('em');mark.className='admin-mark';mark.textContent='官方';meta.append(mark)}meta.append(clock);bubble.className='bubble';bubble.textContent=item.content;body.append(meta,bubble);row.append(avatar,body);list.appendChild(row)}
    async function loadMessages(manual=false){if(manual)status.textContent='正在刷新…';try{const name=nickname.value.trim(),response=await fetch(`${api}?device=${encodeURIComponent(device)}&nickname=${encodeURIComponent(name)}`,{cache:'no-store'}),data=await response.json();if(!response.ok)throw new Error(data.message||'读取失败');list.innerHTML='<div class="chat-day">今天</div>';data.messages.forEach(add);list.scrollTop=list.scrollHeight;online.textContent=`${data.online||1} 人在线`;status.textContent=`六合王实时连接 · ${data.messages.length} 条`;if(/^游客\d{4}$/.test(name)&&data.viewerLocation){nickname.value=`来自${data.viewerLocation}的游客${suffix}`.slice(0,12);storage.set('liuhe-chat-name',nickname.value)}}catch(error){online.textContent='六合王连接失败';status.textContent=error.message||'暂时无法连接'}}
    async function loadDraw(){const el=document.querySelector('#chatDraw');try{const response=await fetch(`/draw-data.php?lottery=5&t=${Date.now()}`,{cache:'no-store'}),payload=await response.json(),data=payload.data;if(payload.code!==0||!data?.numberList?.length)throw new Error();const result=data.numberList.slice(0,7).map((item,index)=>`${index===6?'+ ':''}${String(item.number).padStart(2,'0')}${item.shengXiao||''}`).join('　');el.textContent=`第${data.issueNo}期　${result}`}catch(_){el.textContent='澳门开奖暂时无法同步，请稍后刷新'}}
    nickname.value=storage.get('liuhe-chat-name')||`游客${suffix}`;loadMessages();loadDraw();
    document.querySelectorAll('[data-quick]').forEach(btn=>btn.onclick=()=>{input.value=btn.dataset.quick;input.focus()});
    form.onsubmit=async e=>{e.preventDefault();const name=nickname.value.trim(),message=input.value.trim();if(name.length<2){status.textContent='请填写2至12个字的昵称';return}if(!message)return;if(!/^[\u3400-\u9fff0-9\s]+$/u.test(message)){status.textContent='只允许中文、数字和空格';return}const button=form.querySelector('.send');button.disabled=true;status.textContent='正在发送…';try{const response=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deviceId:device,nickname:name,content:message})}),data=await response.json();if(!response.ok)throw new Error(data.message||'发送失败');storage.set('liuhe-chat-name',name);input.value='';await loadMessages();status.textContent='发送成功'}catch(error){status.textContent=error.message||'发送失败'}finally{button.disabled=false}};
    document.querySelector('#refreshChat').onclick=()=>loadMessages(true);
    nickname.onchange=()=>{nickname.value=nickname.value.replace(/[^\u3400-\u9fff0-9]/gu,'').slice(0,12);storage.set('liuhe-chat-name',nickname.value)};
    setInterval(()=>loadMessages(false),2000);
    setInterval(loadDraw,30000);
  </script>
  <script src="site-stats.js"></script>
  <script src="cnzz-stats.js"></script>
</body>
</html>
