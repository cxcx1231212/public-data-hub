<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>高手资料详情</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070707;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.page{width:min(100%,780px);min-height:100vh;margin:auto;background:#0d0d0e}.topbar{height:62px;display:grid;grid-template-columns:74px 1fr 74px;align-items:center;padding:0 12px;position:sticky;top:0;z-index:5;border-bottom:1px solid #493918;background:#090806}.back{color:#ebc963;text-decoration:none;font-size:16px}.title{text-align:center;color:#f1cf69;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile{display:flex;align-items:center;gap:12px;margin:14px 12px 0;padding:15px;border:1px solid #4e3e20;border-radius:11px;background:linear-gradient(145deg,#18140e,#101010)}.avatar{width:50px;height:50px;display:grid;place-items:center;flex:0 0 auto;border:1px solid #a37b31;border-radius:50%;background:#32230e;color:#f2cf69;font-size:22px;font-weight:900}.profile-copy{min-width:0;flex:1}.profile-copy b{display:block;color:#f1d178;font-size:19px}.profile-copy small{display:block;margin-top:5px;color:#948773;font-size:13px}.badge{padding:6px 10px;border:1px solid #285f38;border-radius:99px;background:#102c1a;color:#65d385;font-size:12px}.summary{margin:12px;padding:13px;border:1px solid #5d4920;border-radius:10px;color:#d7bd6a;text-align:center;font-size:15px;background:#15120c}.records{padding:0 12px}.record{display:grid;grid-template-columns:104px minmax(0,1fr) 72px;align-items:center;gap:10px;min-height:76px;margin-bottom:10px;padding:12px;border:1px solid #353028;border-radius:9px;background:#141414}.period{color:#d1b765;font-size:14px;font-weight:800;text-align:center}.value{min-width:0;color:#efd174;font-size:17px;font-weight:800;line-height:1.65;text-align:center;word-break:break-word}.result{text-align:center;color:#9a8b70;font-size:12px;line-height:1.5}.state{display:block;margin-top:3px;color:#c8af65;font-size:14px;font-weight:900}.state.hit{color:#ff525d}.state.miss{color:#888}.hit-token{display:inline-block;margin:0 2px;padding:0 4px;border-radius:4px;background:#8f1720;color:#fff}.pager{display:flex;align-items:center;justify-content:center;gap:18px;padding:6px 12px 24px}.pager button{min-width:92px;height:40px;border:1px solid #6a5423;border-radius:8px;background:#17140e;color:#e8c75f;font:800 14px inherit}.pager button:disabled{opacity:.3}.pager span{min-width:70px;text-align:center;color:#9c8f78}.empty{margin:12px;padding:42px 15px;border:1px solid #3e3422;border-radius:10px;color:#b8a36a;text-align:center;font-size:16px;line-height:1.8}.note{text-align:center;color:#5e574d;font-size:12px;padding:0 12px 26px}@media(max-width:520px){.topbar{grid-template-columns:62px 1fr 62px}.title{font-size:17px}.record{grid-template-columns:76px minmax(0,1fr) 58px;gap:6px;padding:10px 6px}.period{font-size:12px}.value{font-size:15px}.result{font-size:10px}.profile{padding:12px}.badge{display:none}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar"><a class="back" href="index.html#expertGrid">‹ 返回</a><strong class="title" id="title">高手资料详情</strong><span></span></header>
    <section class="profile"><span class="avatar" id="avatar">高</span><div class="profile-copy"><b id="author">高手资料</b><small id="meta">资料加载中…</small></div><span class="badge">免费公开</span></section>
    <div class="summary" id="summary">正在读取本站资料…</div>
    <section class="records" id="records"></section>
    <div class="pager"><button id="prev">上一页</button><span id="pageState">1 / 1</span><button id="next">下一页</button></div>
    <p class="note">资料内容仅供参考，开奖结果以官方公布为准</p>
  </main>
  <script src="expert-catalog.js?v=3"></script>
  <script>
    const params=new URLSearchParams(location.search),lottery=params.get('lottery')||'澳门',catalogId=params.get('id'),catalogItem=catalogId!==null&&catalogId!==''?window.MAHUI_EXPERT_CATALOG?.[Number(catalogId)]:null,author=catalogItem?.author||params.get('author')||'高手资料',category=catalogItem?.category||params.get('category')||'资料';
    let rows=[],page=1;const pageSize=8;
    const safe=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function highlighted(content,result){let html=safe(content),tokens=[...(String(result).match(/\d{1,2}|[鼠牛虎兔龙蛇马羊猴鸡狗猪]/g)||[])];for(const token of [...new Set(tokens)]){if(!token)continue;const escaped=token.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');html=html.replace(new RegExp(`(^|[^0-9])(${escaped})(?=$|[^0-9])`,'g'),(_,before,match)=>`${before}<span class="hit-token">${match}</span>`)}return html}
    function render(){const pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,pages);const list=rows.slice((page-1)*pageSize,page*pageSize);document.querySelector('#records').innerHTML=list.length?list.map(row=>{const status=row.status==='hit'?['hit','命中']:row.status==='miss'?['miss','未中']:['','待开奖'];return`<article class="record"><span class="period">${safe(String(row.issue).replace(/^2026/,''))}期</span><div class="value">${highlighted(row.content,row.result)}</div><span class="result">${row.result?safe(row.result):''}<b class="state ${status[0]}">${status[1]}</b></span></article>`}).join(''):'<div class="empty">该项资料暂未录入<br>请稍后刷新查看</div>';const settled=rows.filter(row=>row.status!=='pending').slice(0,8),hits=settled.filter(row=>row.status==='hit').length;document.querySelector('#summary').textContent=rows.length?`共${rows.length}期记录 · 近${settled.length}期命中${hits}期`:'本站资料正在整理';document.querySelector('#pageState').textContent=`${page} / ${pages}`;document.querySelector('#prev').disabled=page<=1;document.querySelector('#next').disabled=page>=pages}
    document.title=`${author} · ${category}`;document.querySelector('#title').textContent=`${author} · ${category}`;document.querySelector('#author').textContent=author;document.querySelector('#avatar').textContent=[...author][0]||'高';document.querySelector('#meta').textContent=`${lottery} · 【${category}】 · 免费公开`;document.querySelector('#prev').onclick=()=>{if(page>1){page--;render();scrollTo({top:0,behavior:'smooth'})}};document.querySelector('#next').onclick=()=>{if(page*pageSize<rows.length){page++;render();scrollTo({top:0,behavior:'smooth'})}};
    fetch(`content-data.php?t=${Date.now()}`,{cache:'no-store'}).then(response=>response.json()).then(payload=>{rows=(payload.records||[]).filter(row=>row.section==='expert'&&(row.lottery||'澳门')===lottery&&row.author===author&&row.category===category).sort((a,b)=>String(b.issue).localeCompare(String(a.issue)));render()}).catch(error=>{console.error('[马会资料] 高手资料加载失败',error);document.querySelector('#summary').textContent='资料加载失败，请刷新后重试';render()});
  </script>
</body>
</html>
