<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>六合公式－马会资料</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080808;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.page{width:min(100%,760px);min-height:100vh;margin:auto;background:#0e0e0e}.topbar{height:58px;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;padding:0 11px;border-bottom:1px solid #342a16;background:#090806;position:sticky;top:0;z-index:4}.topbar a{color:#e7c55e;text-decoration:none;font-size:15px}.title{text-align:center;color:#f0cf69;font-size:18px}.hero{padding:17px 14px;text-align:center;border-bottom:1px solid #332a18;background:linear-gradient(145deg,#211b0d,#0e0d0a)}.hero b{display:block;color:#efd06e;font-size:20px}.hero small{display:block;margin-top:6px;color:#837a6c;font-size:11px}.result{margin:10px;padding:15px;border:1px solid #775d24;border-radius:10px;background:linear-gradient(145deg,#1c170b,#11100d)}.selected{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:15px}.big-ball{width:58px;height:58px;display:grid;place-items:center;border-radius:50%;background:#c13a35;color:#fff;font-size:23px;font-weight:900;box-shadow:inset 0 -5px 0 rgba(0,0,0,.17)}.big-ball.blue{background:#367cc1}.big-ball.green{background:#34955a}.selected-copy b{display:block;color:#f0cf69;font-size:20px}.selected-copy small{display:block;margin-top:4px;color:#8b8171;font-size:11px}.properties{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.property{min-height:54px;padding:8px 4px;border:1px solid #3c3428;border-radius:7px;background:#121212;text-align:center}.property small{display:block;color:#756d62;font-size:9px}.property b{display:block;margin-top:6px;color:#e2c379;font-size:13px}.section{margin:10px;padding:12px;border:1px solid #302b23;border-radius:9px;background:#131313}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-head b{color:#d9bd6a;font-size:14px}.section-head small{color:#70695f;font-size:9px}.number-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 5px}.number{width:38px;max-width:100%;aspect-ratio:1;margin:auto;border:1px solid #5d4b2d;border-radius:50%;background:#171717;color:#c9b988;font:800 12px inherit;cursor:pointer}.number.active{border-color:#f0ce66;background:linear-gradient(145deg,#d2a842,#8d6216);color:#120d05;box-shadow:0 0 0 2px rgba(221,184,78,.18)}.related{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.related-card{padding:10px 8px;border:1px solid #393124;border-radius:8px;background:#111}.related-card b{display:block;color:#d8ba68;font-size:12px}.related-card p{margin:7px 0 0;color:#aaa08f;font-size:11px;line-height:1.65;word-break:break-word}.note{padding:2px 14px 24px;text-align:center;color:#5f5950;font-size:10px}@media(max-width:430px){.properties{grid-template-columns:repeat(4,1fr);gap:4px}.property b{font-size:11px}.number-grid{gap:7px 4px}.number{width:34px;font-size:11px}.related{grid-template-columns:1fr}.related-card{display:grid;grid-template-columns:68px 1fr;align-items:center}.related-card p{margin:0}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar"><a href="index.html">‹ 返回</a><strong class="title">六合公式</strong><span></span></header>
    <section class="hero"><b>号码属性查询</b><small id="syncState">正在同步澳门最新特码…</small></section>
    <section class="result"><div class="selected"><span class="big-ball" id="bigBall">17</span><div class="selected-copy"><b id="mainLabel">虎 · 红波</b><small id="subLabel">2026年生肖号码属性</small></div></div><div class="properties" id="properties"></div></section>
    <section class="section"><div class="section-head"><b>选择号码</b><small>01–49</small></div><div class="number-grid" id="numberGrid"></div></section>
    <section class="section"><div class="section-head"><b>同属性号码</b><small>自动归类</small></div><div class="related" id="related"></div></section>
    <p class="note">生肖按2026年马年排列 · 五行与波色按页面标准对照 · 仅供资料查询</p>
  </main>
  <script>
    const zodiacs=['马','蛇','龙','兔','虎','牛','鼠','猪','狗','鸡','猴','羊'],red=new Set([1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46]),blue=new Set([3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48]),elements={金:[3,4,17,18,25,26,39,40,47,48],木:[7,8,15,16,29,30,37,38],水:[5,6,13,14,21,22,35,36,43,44],火:[1,2,9,10,23,24,31,32,45,46],土:[11,12,19,20,27,28,33,34,41,42,49]},domestic=new Set(['牛','马','羊','鸡','狗','猪']);
    const all=Array.from({length:49},(_,i)=>i+1),zodiac=n=>zodiacs[(n-1)%12],wave=n=>red.has(n)?'红波':blue.has(n)?'蓝波':'绿波',element=n=>Object.keys(elements).find(x=>elements[x].includes(n))||'土',format=nums=>nums.map(n=>String(n).padStart(2,'0')).join(' '),color=n=>wave(n)==='红波'?'':wave(n)==='蓝波'?'blue':'green';
    function render(n){const sx=zodiac(n),bs=wave(n),wx=element(n),sum=Math.floor(n/10)+n%10;document.querySelector('#bigBall').className=`big-ball ${color(n)}`;document.querySelector('#bigBall').textContent=String(n).padStart(2,'0');document.querySelector('#mainLabel').textContent=`${sx} · ${bs}`;document.querySelector('#properties').innerHTML=[['单双',n%2?'单':'双'],['大小',n>=25?'大':'小'],['合数',`${sum} · ${sum%2?'合单':'合双'}`],['五行',wx],['头数',`${Math.floor(n/10)}头`],['尾数',`${n%10}尾`],['家野',domestic.has(sx)?'家肖':'野肖'],['生肖',sx]].map(x=>`<span class="property"><small>${x[0]}</small><b>${x[1]}</b></span>`).join('');document.querySelectorAll('[data-number]').forEach(x=>x.classList.toggle('active',Number(x.dataset.number)===n));document.querySelector('#related').innerHTML=`<div class="related-card"><b>同生肖 · ${sx}</b><p>${format(all.filter(x=>zodiac(x)===sx))}</p></div><div class="related-card"><b>同波色 · ${bs}</b><p>${format(all.filter(x=>wave(x)===bs))}</p></div><div class="related-card"><b>同五行 · ${wx}</b><p>${format(elements[wx])}</p></div>`}
    document.querySelector('#numberGrid').innerHTML=all.map(n=>`<button class="number" data-number="${n}">${String(n).padStart(2,'0')}</button>`).join('');document.querySelector('#numberGrid').onclick=e=>{const button=e.target.closest('[data-number]');if(button){render(Number(button.dataset.number));document.querySelector('#syncState').textContent='已切换为手动查询号码'}};render(17);
    async function loadLatestSpecial(){try{const response=await fetch(`draw-data.php?lottery=5&t=${Date.now()}`,{cache:'no-store'}),payload=await response.json(),list=payload?.data?.numberList;if(payload.code!==0||!Array.isArray(list)||!list[6])throw new Error();render(Number(list[6].number));document.querySelector('#syncState').textContent=`澳门第${payload.data.issueNo}期最新特码 · 点击其他号码可查询`}catch(_){document.querySelector('#syncState').textContent='点击01–49任意号码，立即显示完整属性'}}
    loadLatestSpecial();
  </script>
  <script src="site-stats.js"></script>
  <script src="cnzz-stats.js"></script>
</body>
</html>
