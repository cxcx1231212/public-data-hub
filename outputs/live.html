<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>开奖直播－马会资料</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080808;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.page{width:min(100%,760px);min-height:100vh;margin:auto;background:#0d0d0d}.topbar{height:58px;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;padding:0 10px;border-bottom:1px solid #342a16;background:#090806;position:sticky;top:0;z-index:5}.topbar a{color:#e7c55e;text-decoration:none;font-size:15px}.title{text-align:center;color:#f0cf69;font-size:18px}.tabs{display:flex;gap:7px;padding:11px 10px;border-bottom:1px solid #29241a}.tabs button{flex:1;min-height:38px;border:1px solid #443a25;border-radius:7px;background:#17140e;color:#a99b78;font:800 13px inherit;cursor:pointer}.tabs button.active{border-color:#c79a31;background:linear-gradient(180deg,#e2bd58,#9e701a);color:#171006}.live-card{margin:10px;border:1px solid #443824;border-radius:10px;overflow:hidden;background:#111}.live-head{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid #332a1a}.live-name b{display:block;color:#f0cf69;font-size:17px}.live-name small{display:block;margin-top:4px;color:#8d8370;font-size:11px}.status{display:flex;align-items:center;gap:5px;color:#e6b951;font-size:11px;white-space:nowrap}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:#dcae45;box-shadow:0 0 9px #dcae45}.status.playing{color:#62d483}.status.playing:before{background:#39c86c;box-shadow:0 0 9px #39c86c}.stage{position:relative;aspect-ratio:16/9;min-height:220px;background:#020202;overflow:hidden}.stage video{display:block;width:100%;height:100%;object-fit:contain;background:#020202}.player-mask{position:absolute;inset:0;display:grid;place-content:center;gap:12px;text-align:center;padding:20px;background:radial-gradient(circle at center,#201b0f 0,#050505 72%);color:#b7aa88;font-size:13px}.player-mask[hidden]{display:none}.player-mask strong{color:#f0cf69;font-size:16px}.player-mask button,.tools button{border:1px solid #8c6a25;border-radius:6px;background:#2b2110;color:#f0cf69;padding:8px 15px;font:700 12px inherit;cursor:pointer}.tools{display:flex;align-items:center;gap:7px;padding:10px 11px;border-top:1px solid #2d271c;background:#0d0c09}.tools button.active{background:#c4942f;color:#171006}.tools .spacer{flex:1}.tools a{color:#d9bd65;text-decoration:none;font-size:12px}.source{display:flex;align-items:center;gap:8px;padding:0 11px 11px;color:#716b5d;font-size:10px}.source span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source button{border:0;background:none;color:#cba649;padding:2px;cursor:pointer}.draw{margin:10px;padding:12px;border:1px solid #332b1c;border-radius:9px;background:#12110e}.draw-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.draw-head b{color:#efd06d}.draw-head span{color:#888;font-size:11px}.balls{display:flex;justify-content:center;align-items:flex-start;gap:5px;flex-wrap:wrap}.ball-wrap{text-align:center}.ball{width:35px;height:35px;display:grid;place-items:center;border-radius:50%;background:#c13a35;color:#fff;font-weight:900}.ball.red{background:#c13a35}.ball.blue{background:#3982c5}.ball.green{background:#399a58}.ball.waiting{border:1px solid #5b5141;background:linear-gradient(#34312b,#171715);color:#b7aa8c}.ball-wrap small{display:block;margin-top:4px;color:#ccc;font-size:10px}.ball-wrap.waiting small{color:#756d5e}.plus{line-height:35px;color:#e6c55e;font-size:18px;font-weight:900}.notice{margin:10px;padding:11px 12px;border:1px solid #3b311d;border-radius:8px;background:#17130b;color:#b6a777;font-size:12px;line-height:1.65}@media(max-width:430px){.tabs button{font-size:11px}.live-head{align-items:flex-start}.ball{width:31px;height:31px;font-size:12px}.plus{line-height:31px}.tools{flex-wrap:wrap}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar"><a href="index.html">‹ 返回</a><strong class="title">开奖直播</strong><span></span></header>
    <nav class="tabs" aria-label="直播彩种"><button class="active" data-lottery="澳门">澳门</button><button data-lottery="香港">香港</button><button data-lottery="疯狂天天彩">疯狂天天彩</button></nav>
    <section class="live-card">
      <header class="live-head"><div class="live-name"><b id="liveName">澳门开奖直播</b><small id="liveTime">开奖日 21:30 开始</small></div><span class="status" id="liveStatus">正在获取直播线路</span></header>
      <div class="stage"><video id="liveVideo" controls playsinline muted preload="none"></video><div class="player-mask" id="playerMask"><strong id="maskTitle">直播线路连接中</strong><span id="maskText">正在获取最新播放地址…</span><button id="retryButton" type="button">重新连接</button></div></div>
      <div class="tools"><button class="active" id="mainLine" type="button">直播线路</button><button id="refreshLine" type="button">刷新线路</button><span class="spacer"></span><a href="https://azy1.sadfr85g.com/#/recommend/?channelCode=54#/recommend" target="_blank" rel="noopener noreferrer">备用直播页 ›</a></div>
      <div class="source"><b>播放地址</b><span id="sourceUrl">获取中…</span><button id="copySource" type="button">复制</button></div>
    </section>
    <section class="draw"><div class="draw-head"><b id="drawTitle">最新开奖同步中…</b><span>实时开奖结果</span></div><div class="balls" id="balls"></div></section>
    <div class="notice">直播源和开奖结果均由接口实时获取。开奖前线路可能暂未推流，点击“刷新线路”即可重新连接；浏览器限制自动播放时，请点击播放器中的播放按钮。</div>
  </main>
  <script src="vendor/flv.min.js?v=1.6.2"></script>
  <script>
    const lotteries={'澳门':{name:'澳门开奖直播',time:'开奖日 21:30 开始',liveId:5,drawId:5},'香港':{name:'香港开奖直播',time:'开奖日 21:30 开始',liveId:1,drawId:6},'疯狂天天彩':{name:'疯狂天天彩直播',time:'每日开奖时段开放',liveId:8,drawId:11}};
    const video=document.querySelector('#liveVideo'),mask=document.querySelector('#playerMask'),maskTitle=document.querySelector('#maskTitle'),maskText=document.querySelector('#maskText'),statusEl=document.querySelector('#liveStatus'),sourceEl=document.querySelector('#sourceUrl');let active='澳门',player=null,streamUrl='',requestKey=0;const color=value=>Number(value)===1?'red':Number(value)===2?'blue':Number(value)===3?'green':'';
    function destroyPlayer(){if(player){try{player.pause();player.unload();player.detachMediaElement();player.destroy()}catch(_){}player=null}video.pause();video.removeAttribute('src');video.load()}
    function showMask(title,text,button=true){maskTitle.textContent=title;maskText.textContent=text;document.querySelector('#retryButton').hidden=!button;mask.hidden=false}
    function setStatus(text,playing=false){statusEl.textContent=text;statusEl.classList.toggle('playing',playing)}
    function playStream(url){destroyPlayer();streamUrl=url||'';sourceEl.textContent=streamUrl||'当前接口暂未提供播放地址';if(!streamUrl){setStatus('等待直播源');showMask('暂未开始直播','当前彩种还没有推送播放地址，请在开奖时段刷新线路。');return}setStatus('正在连接直播');showMask('直播线路连接中','正在载入实时视频画面…',false);if(window.flvjs&&flvjs.isSupported()){player=flvjs.createPlayer({type:'flv',url:streamUrl,isLive:true,hasAudio:true,hasVideo:true},{enableStashBuffer:false,stashInitialSize:128,lazyLoad:false});player.attachMediaElement(video);player.load();player.on(flvjs.Events.ERROR,()=>{setStatus('线路连接失败');showMask('线路暂时无法播放','直播可能尚未开始，或线路正在切换，请稍后重试。')});video.play().catch(()=>{mask.hidden=true;setStatus('点击播放',true)})}else{video.src=streamUrl;video.play().catch(()=>{});mask.hidden=true}}
    function renderBalls(data,name){const raw=Array.isArray(data?.numberList)?data.numberList:[],received=raw.filter(item=>/^\d{1,2}$/.test(String(item.number))).slice(0,7),waiting=Number(data?.closeCount)===0&&data?.nextLotteryIssueNo&&String(data.nextLotteryIssueNo)!==String(data.issueNo)&&Number(data.openCount||0)===0&&(received.length===0||received.length===7),list=waiting?[]:received,slots=Array.from({length:7},(_,index)=>list[index]||null),issue=waiting?data.nextLotteryIssueNo:data?.issueNo||data?.period||data?.intPeriod||'';document.querySelector('#drawTitle').textContent=waiting?`${name}第${issue}期开奖中 · 等待号码`:list.length?`${name}第${issue}期 · 已开${list.length}/7`:`${name}第${issue}期 · 等待开奖`;document.querySelector('#balls').innerHTML=slots.map((item,index)=>`${index===6?'<span class="plus">+</span>':''}<span class="ball-wrap ${item?'':'waiting'}"><span class="ball ${item?color(item.color):'waiting'}">${item?String(item.number).padStart(2,'0'):'--'}</span><small>${item?.shengXiao||'等待'}</small></span>`).join('')}
    async function fetchDraw(name,key){try{const res=await fetch(`draw-data.php?lottery=${lotteries[name].drawId}&t=${Date.now()}`,{cache:'no-store'}),payload=await res.json();if(key===requestKey&&payload.code===0)renderBalls(payload.data,name)}catch(_){if(key===requestKey)document.querySelector('#drawTitle').textContent=`${name}开奖数据暂时无法同步`}}
    async function loadLive(force=false){const name=active,item=lotteries[name],key=++requestKey;document.querySelector('#liveName').textContent=item.name;document.querySelector('#liveTime').textContent=item.time;setStatus('正在获取直播线路');if(force)showMask('正在刷新线路','正在重新获取最新播放地址…',false);fetchDraw(name,key);try{const res=await fetch(`live-data.php?lottery=${item.liveId}&t=${Date.now()}`,{cache:'no-store'}),payload=await res.json();if(key!==requestKey)return;if(payload.code!==0||!payload.data)throw new Error();const next=String(payload.data.videoUrlForH5||payload.data.videoUrl||'');if(force||next!==streamUrl||!player)playStream(next);else setStatus(video.paused?'线路已接通':'正在直播',!video.paused)}catch(_){if(key===requestKey){setStatus('接口连接失败');showMask('直播接口暂时不可用','请稍后点击重新连接。')}}}
    document.querySelectorAll('[data-lottery]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-lottery]').forEach(x=>x.classList.remove('active'));button.classList.add('active');active=button.dataset.lottery;streamUrl='';destroyPlayer();document.querySelector('#balls').innerHTML='';loadLive(true)});document.querySelector('#retryButton').onclick=()=>loadLive(true);document.querySelector('#refreshLine').onclick=()=>loadLive(true);document.querySelector('#mainLine').onclick=()=>streamUrl?playStream(streamUrl):loadLive(true);document.querySelector('#copySource').onclick=async()=>{if(!streamUrl)return;try{await navigator.clipboard.writeText(streamUrl);document.querySelector('#copySource').textContent='已复制';setTimeout(()=>document.querySelector('#copySource').textContent='复制',1200)}catch(_){}};video.addEventListener('playing',()=>{mask.hidden=true;setStatus('正在直播',true)});video.addEventListener('waiting',()=>setStatus('直播缓冲中'));video.addEventListener('pause',()=>{if(video.currentTime>0)setStatus('直播已暂停')});loadLive(true);setInterval(()=>{if(!document.hidden)loadLive(false)},5000);
  </script>
  <script src="site-stats.js"></script>
  <script src="cnzz-stats.js"></script>
</body>
</html>
